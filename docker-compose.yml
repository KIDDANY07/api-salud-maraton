name: rural-health-routes

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rural}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rural_demo_password}
      POSTGRES_DB: ${POSTGRES_DB:-rural_routes}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_demo_password}
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: .
    environment:
      NODE_ENV: production
      PORT: 3000
      URL_DB: postgres://${POSTGRES_USER:-rural}:${POSTGRES_PASSWORD:-rural_demo_password}@postgres:5432/${POSTGRES_DB:-rural_routes}
      ROAD_FACTOR: ${ROAD_FACTOR:-1.3}
      VEREDAS_DATA_PATH: data/veredas.json
      OAUTH_ISSUER: http://localhost:8080/realms/rural-health
      OAUTH_AUDIENCE: rural-routes-api
      OAUTH_JWKS_URI: http://keycloak:8080/realms/rural-health/protocol/openid-connect/certs
      OAUTH_TOKEN_URL: http://localhost:8080/realms/rural-health/protocol/openid-connect/token
      OAUTH_AUTHORIZATION_URL: http://localhost:8080/realms/rural-health/protocol/openid-connect/auth
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: rural-health
      LOGIN_CLIENT_ID: ${LOGIN_CLIENT_ID:-rural-routes-web}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-rural-routes-admin-api}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-admin-api-demo-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4200}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      SELF_REGISTRATION_ENABLED: ${SELF_REGISTRATION_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SWAGGER_ENABLED: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  postgres_data:
